<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTW Workbench</title>
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
</head>
<body class="dark bg-surface text-white h-screen flex overflow-hidden font-sans">
  <aside class="w-64 flex-shrink-0 bg-panel border-r border-border flex flex-col">
    <div class="px-4 pt-5 pb-3 flex items-center justify-between">
      <div><p class="text-xs text-muted uppercase tracking-widest">BTW</p><h1 class="text-lg font-semibold">Workbench</h1></div>
      <button id="new-chat-btn" title="New chat" class="w-7 h-7 rounded-md border border-border flex items-center justify-center text-muted hover:text-white hover:border-accent transition-colors">+</button>
    </div>
    <div class="px-3 pt-2"><p class="text-xs text-muted uppercase tracking-widest px-1 mb-2">Local Sessions</p><div id="session-list"></div></div>
    <div class="mt-auto px-4 pb-5"><p class="text-xs text-muted leading-relaxed">Private by default.<br>Nothing leaves this machine except configured model requests.</p><div class="flex gap-1 mt-4 bg-black/30 rounded-lg p-1"><button id="conversation-tab" class="flex-1 text-xs py-1.5 rounded-md text-muted hover:text-white transition-colors">CONVERSATION</button><button id="workbench-tab" class="flex-1 text-xs py-1.5 rounded-md bg-white/10 text-white font-medium">Workbench</button></div></div>
  </aside>
  <main id="main" class="flex-1 flex flex-col min-w-0 relative transition-[margin] duration-200">
    <div class="h-12 border-b border-border flex items-center justify-between px-4 flex-shrink-0"><span id="model-badge" class="text-xs text-muted bg-white/5 px-2 py-1 rounded-full border border-border">Workbench</span><button id="abort-btn" class="hidden text-xs text-red-400 border border-red-900 px-3 py-1 rounded-full hover:bg-red-950 transition-colors">Stop generating</button></div>
    <div id="messages-container" class="flex-1 overflow-y-auto px-4 py-6 flex flex-col gap-6 scroll-smooth"><div id="empty-state" class="flex-1 flex items-center justify-center"><p class="text-muted text-sm">Workbench ready. Ask for a detailed answer, paste code, or attach a file.</p></div></div>
    <div id="history-panel" class="hidden flex-1 overflow-y-auto px-4 py-6"><input id="history-search" type="search" placeholder="Search conversations" class="mb-4 w-full rounded-xl border border-border bg-black/30 px-3 py-2 text-sm text-white outline-none focus:border-accent/50"><div id="history-list" class="space-y-1"></div></div>
    <div id="input-area" class="flex-shrink-0 px-4 pb-4 pt-2 border-t border-border bg-panel/50 backdrop-blur"><div id="file-preview-bar" class="flex flex-wrap gap-2 mb-2 empty:hidden"></div><div class="flex items-end gap-3 bg-black/40 border border-border rounded-2xl px-4 py-3 focus-within:border-accent/50 transition-colors"><button id="attach-btn" title="Attach files" class="text-muted hover:text-white transition-colors flex-shrink-0 pb-0.5"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button><div id="text-input" contenteditable="true" role="textbox" aria-multiline="true" class="flex-1 outline-none text-sm text-white min-h-[24px] max-h-[200px] overflow-y-auto resize-none bg-transparent leading-relaxed" data-placeholder="Ask the workbench anything..."></div><button id="send-btn" title="Send message" class="flex-shrink-0 w-8 h-8 rounded-xl bg-accent flex items-center justify-center hover:bg-accent/80 transition-colors disabled:opacity-30 disabled:cursor-not-allowed"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 7-7 7 7M12 19V5"/></svg></button></div><p class="text-center text-xs text-muted mt-2">Detailed responses are enabled for this workbench session.</p></div>
  </main>
  <div id="dropzone-overlay" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm items-center justify-center border-2 border-dashed border-accent"><p class="text-white text-lg font-medium">Drop files to attach</p></div>
  <input type="file" id="file-input" class="hidden" multiple>
  <aside id="debug-panel" class="fixed top-0 right-0 h-full w-[420px] max-w-full bg-panel border-l border-border z-40 flex flex-col transform translate-x-full transition-transform duration-200 ease-out">
    <div id="debug-header" class="flex items-center justify-between px-4 py-3 border-b border-border flex-shrink-0"><span class="text-sm font-medium">Response Details</span><button id="debug-close" title="Close details" class="text-muted hover:text-white">&times;</button></div>
    <div id="debug-body" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-5"></div>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
